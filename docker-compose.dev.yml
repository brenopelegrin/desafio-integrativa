
services:
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`traefik.project`, `processotop-dev`)"
      - "--entrypoints.web.address=:80"
    ports:
      - "8087:80"
      - "8080:8080" # Dashboard do traefik
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - proxy-tier

  db:
    image: postgres:16-alpine
    env_file: .env.dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    networks:
      - backend-tier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gerenciador_processos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.dev
    labels:
      - "traefik.project=processotop-dev"
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DEPLOY_EXTERNAL_DOMAIN:-localhost}`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.docker.network=desafio-integrativa_proxy-tier"
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy-tier
      - backend-tier

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - BACKEND_URL=http://api:8080
    labels:
      - "traefik.project=processotop-dev"
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DEPLOY_EXTERNAL_DOMAIN:-localhost}`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=desafio-integrativa_proxy-tier"
    ports:
      - "4200:80"
    networks:
      - proxy-tier

networks:
  proxy-tier:
  backend-tier:

volumes:
  pgdata-dev:
