<div class="layout-wrapper">
  <aside class="sidebar" [class.collapsed]="isSidebarCollapsed">
    <div class="logo" *ngIf="!isSidebarCollapsed" style="justify-content: space-between;">
      <div class="flex align-items-center gap-2">
        <i class="pi pi-folder-open text-primary" style="font-size: 1.5rem;"></i>
        <span class="menu-text font-bold text-lg">ProcessoTop</span>
      </div>
      <button class="sidebar-toggle-btn" (click)="toggleSidebar()">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <div class="logo" *ngIf="isSidebarCollapsed" style="justify-content: center;">
      <button class="sidebar-toggle-btn" (click)="toggleSidebar()">
        <i class="pi pi-bars"></i>
      </button>
    </div>

    <nav class="nav-menu">
      <a routerLink="/processos" routerLinkActive="active" class="nav-item">
        <i class="pi pi-briefcase"></i>
        <span class="menu-text">Processos</span>
      </a>
      <a routerLink="/entidades" routerLinkActive="active" class="nav-item">
        <i class="pi pi-users"></i>
        <span class="menu-text">Entidades Legais</span>
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <button class="mobile-menu-btn" (click)="toggleSidebar()">
        <i class="pi pi-bars"></i>
      </button>
      <h2>{{ pageTitle }}</h2>
    </div>
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
